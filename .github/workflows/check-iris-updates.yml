name: Check Iris updates

on:
  schedule:
    # Mondays at 04:20 UTC
    - cron: "20 4 * * 1"
  push:
    paths:
      - ".github/workflows/check-iris-updates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      - name: Look for newer Iris and Oculus builds
        run: ./gradlew checkIrisUpdates --console=plain
      - name: Show the results on the run page
        if: failure()
        run: if [ -f build/reports/irisUpdates.md ]; then cat build/reports/irisUpdates.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload the results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iris-updates
          path: build/reports/irisUpdates.md
          if-no-files-found: ignore
